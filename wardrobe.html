<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>옷 입히기 시험</title>
<style>
body{margin:0;background:#7da23e;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block}
#ui{position:fixed;left:8px;right:8px;bottom:8px;background:#fff8e6;border:2px solid #c9a96a;border-radius:12px;padding:8px 10px;max-width:560px;margin:0 auto}
#ui b{font-size:13px;color:#6a4a20;margin-right:6px}
.row{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 0}
.row button{flex:none;border:2px solid #d8c49a;background:#fff;border-radius:10px;padding:4px 8px;font-size:13px;display:flex;align-items:center;gap:5px}
.row button.on{border-color:#3f8a3c;background:#e9f6e2;font-weight:700}
.row i{width:18px;height:18px;border-radius:4px;display:inline-block;border:1px solid #0003}
#act{margin-top:4px;display:flex;gap:6px}#act button{border:0;background:#3f8a3c;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
#tip{position:fixed;top:8px;left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #0008}
</style></head><body>
<canvas id="c"></canvas><div id="tip">땅을 누르면 걸어가요 · PC는 방향키도 돼요</div>
<div id="ui"><div class="row" id="tops"><b>상의</b></div><div class="row" id="bots"><b>하의</b></div>
<div id="act"><button data-a="hoe">괭이질</button><button data-a="water">물 주기</button><button data-a="plant">심기</button><button data-a="pull">뽑기</button></div></div>
<script>
const HM={"walk": [[{"x": 0, "y": 0, "w": 64, "h": 114, "ax": 32, "ay": 114}, {"x": 65, "y": 0, "w": 62, "h": 111, "ax": 31, "ay": 111}, {"x": 128, "y": 0, "w": 60, "h": 114, "ax": 33, "ay": 114}, {"x": 189, "y": 0, "w": 64, "h": 114, "ax": 32, "ay": 114}, {"x": 254, "y": 0, "w": 60, "h": 110, "ax": 31, "ay": 110}, {"x": 315, "y": 0, "w": 61, "h": 114, "ax": 33, "ay": 114}], [{"x": 377, "y": 0, "w": 62, "h": 115, "ax": 32, "ay": 115}, {"x": 440, "y": 0, "w": 61, "h": 112, "ax": 32, "ay": 112}, {"x": 502, "y": 0, "w": 61, "h": 116, "ax": 34, "ay": 116}, {"x": 564, "y": 0, "w": 66, "h": 116, "ax": 33, "ay": 116}, {"x": 631, "y": 0, "w": 61, "h": 112, "ax": 32, "ay": 112}, {"x": 693, "y": 0, "w": 62, "h": 116, "ax": 34, "ay": 116}]], "hoe": [[{"x": 756, "y": 0, "w": 92, "h": 128, "ax": 56, "ay": 126}, {"x": 849, "y": 0, "w": 99, "h": 109, "ax": 47, "ay": 108}, {"x": 0, "y": 129, "w": 97, "h": 107, "ax": 48, "ay": 105}, {"x": 98, "y": 129, "w": 94, "h": 112, "ax": 51, "ay": 111}], [{"x": 193, "y": 129, "w": 79, "h": 130, "ax": 35, "ay": 129}, {"x": 273, "y": 129, "w": 106, "h": 110, "ax": 54, "ay": 109}, {"x": 380, "y": 129, "w": 98, "h": 108, "ax": 53, "ay": 107}, {"x": 479, "y": 129, "w": 95, "h": 112, "ax": 50, "ay": 110}]], "plant": [[{"x": 575, "y": 129, "w": 90, "h": 116, "ax": 52, "ay": 115}, {"x": 666, "y": 129, "w": 94, "h": 117, "ax": 53, "ay": 115}, {"x": 761, "y": 129, "w": 89, "h": 116, "ax": 53, "ay": 114}, {"x": 851, "y": 129, "w": 90, "h": 116, "ax": 51, "ay": 114}], [{"x": 0, "y": 260, "w": 87, "h": 113, "ax": 42, "ay": 111}, {"x": 88, "y": 260, "w": 103, "h": 115, "ax": 57, "ay": 113}, {"x": 192, "y": 260, "w": 91, "h": 114, "ax": 46, "ay": 113}, {"x": 284, "y": 260, "w": 90, "h": 114, "ax": 45, "ay": 112}]], "water": [[{"x": 375, "y": 260, "w": 82, "h": 121, "ax": 45, "ay": 120}, {"x": 458, "y": 260, "w": 86, "h": 122, "ax": 52, "ay": 121}, {"x": 545, "y": 260, "w": 92, "h": 121, "ax": 54, "ay": 118}, {"x": 638, "y": 260, "w": 83, "h": 124, "ax": 43, "ay": 122}], [{"x": 722, "y": 260, "w": 92, "h": 123, "ax": 40, "ay": 121}, {"x": 815, "y": 260, "w": 82, "h": 125, "ax": 41, "ay": 123}, {"x": 898, "y": 260, "w": 111, "h": 125, "ax": 42, "ay": 123}, {"x": 0, "y": 386, "w": 89, "h": 123, "ax": 40, "ay": 121}]], "pull": [[{"x": 90, "y": 386, "w": 85, "h": 90, "ax": 11, "ay": 90}, {"x": 176, "y": 386, "w": 82, "h": 112, "ax": 26, "ay": 111}, {"x": 259, "y": 386, "w": 82, "h": 117, "ax": 30, "ay": 117}], [{"x": 342, "y": 386, "w": 81, "h": 105, "ax": 42, "ay": 104}, {"x": 424, "y": 386, "w": 83, "h": 114, "ax": 57, "ay": 113}, {"x": 508, "y": 386, "w": 76, "h": 117, "ax": 55, "ay": 117}]]};
const BASE='a/wear/base.webp';
// 옷 층: [이름, 그림(없으면 기본)]
const TOPS=[['기본 회색 티',null],['체크 남방','a/wear/top_flannel.webp']];
const BOTS=[['기본 회색 반바지',null],['꽃무늬 몸빼','a/wear/bot_mombbae.webp']];
let topI=0,botI=0;
const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const IM={};const ld=u=>{if(!u)return null;if(!IM[u]){IM[u]=new Image();IM[u].src=u}return IM[u]};ld(BASE);TOPS.forEach(t=>ld(t[1]));BOTS.forEach(t=>ld(t[1]));
// 고르기 단추
function ui(){[['tops',TOPS,()=>topI,v=>topI=v],['bots',BOTS,()=>botI,v=>botI=v]].forEach(([id,L,get,set])=>{const r=document.getElementById(id);r.querySelectorAll('button').forEach(b=>b.remove());
 L.forEach((it,i)=>{const b=document.createElement('button');b.className=get()===i?'on':'';b.textContent=it[0];b.onclick=()=>{set(i);ui()};r.appendChild(b)})})}ui();
// 걷기
const hero={x:0,y:0,tx:0,ty:0,dir:0,flip:false,f:0,t:0,act:null};
addEventListener('pointerdown',e=>{if(e.target!==cv)return;hero.tx=e.clientX-W/2;hero.ty=e.clientY-H/2;hero.act=null});
const K={};addEventListener('keydown',e=>K[e.key]=1);addEventListener('keyup',e=>K[e.key]=0);
document.getElementById('act').onclick=e=>{const b=e.target.closest('button');if(b){hero.act={n:b.dataset.a,f:0,t:0,loop:0};hero.tx=hero.x;hero.ty=hero.y}};
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 let kx=(K.ArrowRight?1:0)-(K.ArrowLeft?1:0),ky=(K.ArrowDown?1:0)-(K.ArrowUp?1:0);if(kx||ky){hero.tx=hero.x+kx*40;hero.ty=hero.y+ky*40;hero.act=null}
 const dx=hero.tx-hero.x,dy=hero.ty-hero.y,dd=Math.hypot(dx,dy),mv=dd>3&&!hero.act;
 if(mv){const s=Math.min(dd,160*dt);hero.x+=dx/dd*s;hero.y+=dy/dd*s;hero.dir=dy<-Math.abs(dx)*.3?1:0;hero.flip=dx<0;hero.t+=dt;if(hero.t>.1){hero.t=0;hero.f++}}else hero.f=0;
 if(hero.act){const a=hero.act;a.t+=dt;if(a.t>.16){a.t=0;a.f++;if(a.f>=HM[a.n][hero.dir].length){a.f=0;if(++a.loop>=2)hero.act=null}}}
 g.fillStyle='#7da23e';g.fillRect(0,0,W,H);g.fillStyle='#8fb24c';for(let y=-H;y<H*2;y+=64)for(let x=-W;x<W*2;x+=128){g.beginPath();g.moveTo(x,y);g.lineTo(x+64,y+32);g.lineTo(x,y+64);g.lineTo(x-64,y+32);g.closePath();if(((x/128+y/64)|0)%2)g.fill()}
 {const L=[ld(BASE),ld(BOTS[botI][1]),ld(TOPS[topI][1])].filter(x=>x&&x.complete&&x.width);const an=hero.act?hero.act.n:'walk',fs=HM[an][hero.dir],m=fs[(hero.act?hero.act.f:hero.f)%fs.length],S=1.6;
  g.save();g.translate(W/2+hero.x,H/2+hero.y);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,0,30,10,0,0,7);g.fill();if(hero.flip)g.scale(-1,1);g.scale(S,S);L.forEach(im=>g.drawImage(im,m.x,m.y,m.w,m.h,-m.ax,-m.ay,m.w,m.h));g.restore()}
 requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
