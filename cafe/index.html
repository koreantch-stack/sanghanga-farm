<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>카페 인 한양</title>
<meta name="theme-color" content="#3b2a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2718;--paper:#fbf3e2;--paper2:#f1e2c4;--wood:#6b4426;--gold:#e7b84a;--red:#b4432f;--green:#4f7d45}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;height:100%;background:#2a1d13;color:var(--ink);font-family:'Gowun Dodum',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;margin:0 auto;height:100%;max-width:min(100vw,calc(100vh*9/16));aspect-ratio:auto;overflow:hidden;background:#3b2a1c}
#scene{position:absolute;inset:0}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.hero{position:absolute;height:31%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));transition:transform .15s}
.hero.helper{height:27%}
#sam.work{transform:translateX(-50%) translateY(-2%) rotate(1.5deg)}
.hero.brew{transform:translateX(-50%) translateY(-2%) rotate(-1.5deg)}
.cust{position:absolute;height:27%;transform:translateX(-50%);transition:left 1.4s linear,opacity .6s;filter:drop-shadow(0 5px 5px rgba(0,0,0,.25))}
.cust img.body{height:100%;display:block}
.cust .bub{position:absolute;left:78%;top:20%;background:#fffaf0;border:2px solid #7a5532;border-radius:14px;padding:3px 5px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.cust .bub img{width:34px;height:34px;object-fit:contain}
.cust.l .bub{left:auto;right:78%}
.cust .bub i{display:block;width:32px;height:4px;border-radius:2px;background:#ddd;overflow:hidden}
.cust .bub i b{display:block;height:100%;background:var(--green);transition:width .3s linear}
.cust .bub.next{border-color:var(--gold);box-shadow:0 0 0 3px rgba(231,184,74,.5),0 3px 6px rgba(0,0,0,.25)}
.cust.gone{opacity:0}
.pop{position:absolute;font:400 22px 'Do Hyeon';color:#ffe9a0;text-shadow:0 2px 0 #5a3410,0 0 4px #000;pointer-events:none;animation:up 1s ease-out forwards;z-index:30;white-space:nowrap}
.pop.bad{color:#ffb3a3}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
#top{position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;gap:6px;align-items:center;background:linear-gradient(#000a,#0000);z-index:20}
.res{display:flex;align-items:center;gap:3px;background:rgba(40,25,12,.72);border:1px solid #c79a5a;border-radius:20px;padding:2px 9px 2px 3px;color:#fff3d6;font:400 17px 'Do Hyeon'}
.res img{width:26px;height:26px;object-fit:contain}
#day{margin-left:auto;color:#fff3d6;font:400 15px 'Do Hyeon';background:rgba(40,25,12,.72);border:1px solid #c79a5a;border-radius:20px;padding:4px 10px;text-align:right;line-height:1.1}
#day small{display:block;font-size:11px;color:#ffd98a}
#app.st2 #event{top:calc(90px + env(safe-area-inset-top))}
#floors{position:absolute;top:calc(46px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:4px;z-index:21}
#floors button{flex:1;border:1px solid #c79a5a;background:rgba(40,25,12,.72);color:#fff3d6;border-radius:14px;padding:5px 0;font:400 14px 'Do Hyeon';cursor:pointer}
#floors .fb-b{flex:1.9;display:flex;align-items:center;justify-content:center;gap:2px}#floors .fb-b img{width:18px;height:18px;object-fit:contain}#floors .fb-b i{font-style:normal;font-size:13px;margin-right:3px}
.res{flex:none}#day{flex:none;white-space:nowrap}#top{flex-wrap:nowrap}
#floors button.on{background:#f5d27a;color:#4a2a0c}
#floors button:disabled{opacity:.45}
.res{font-size:15px}
.bghead{width:100%;height:110px;object-fit:cover;border-radius:12px;margin-bottom:8px}
#event{position:absolute;top:calc(48px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(180,67,47,.92);color:#fff;border-radius:16px;padding:4px 12px;font:400 14px 'Do Hyeon';z-index:20;white-space:nowrap}
#app.pan #brew,#app.pan #combo{display:none!important}
#app.pan #bottom{background:none;pointer-events:none}#app.pan #tabs{pointer-events:auto}
#tabs button.cur{background:#f5d27a}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 8px calc(6px + env(safe-area-inset-bottom));z-index:45;background:linear-gradient(#0000,#000c 40%)}
#combo{position:absolute;left:0;right:0;top:-30px;pointer-events:none;text-align:center;font:400 20px 'Do Hyeon';color:#ffe9a0;text-shadow:0 2px 0 #5a3410,0 0 6px #000;margin-bottom:2px}
#brew{touch-action:manipulation;position:relative;display:block;margin:0 auto 8px;width:70%;height:64px;border:0;border-radius:32px;background:linear-gradient(#f5d27a,#d99a35);box-shadow:0 5px 0 #8a5a1c,0 8px 14px rgba(0,0,0,.4);font:400 26px 'Do Hyeon';color:#4a2a0c;overflow:hidden;cursor:pointer}
#brew:active,#brew.down{transform:translateY(3px);box-shadow:0 2px 0 #8a5a1c}
#scene{touch-action:none}
#brew .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.45);width:0;transition:width .1s}
#brew span{position:relative}
#brew small{position:relative;display:block;font:400 13px 'Gowun Dodum';margin-top:-4px}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#tabs button{border:0;border-radius:12px;background:rgba(251,243,226,.94);padding:4px 0 3px;font:400 14px 'Do Hyeon';color:var(--ink);display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer}
#tabs button img{width:32px;height:32px;object-fit:contain}
#tabs button .dot{position:absolute;top:3px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--red);display:none}
#tabs button.on .dot{display:block}
#panel{border-bottom:2px solid #c9a978;position:absolute;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));height:58%;background:var(--paper);border-radius:22px 22px 0 0;z-index:40;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
#panel.on{transform:none}
#panel header{display:flex;align-items:center;padding:12px 14px 6px;font:400 22px 'Do Hyeon'}
#panel header small{font:400 13px 'Gowun Dodum';color:#7b6247;margin-left:8px}
#panel header button{margin-left:auto;border:0;background:#e6d3ae;border-radius:50%;width:34px;height:34px;font:400 18px 'Do Hyeon';cursor:pointer}
#plist{overflow-y:auto;padding:4px 12px 18px;flex:1}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e3cfa6;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.row img{width:50px;height:50px;object-fit:contain;flex:none}
.row img.por{border-radius:50%;object-fit:cover;object-position:center 12%;background:#fff;border:2px solid #d9bd8a}
.row div{flex:1;min-width:0}
.row b{display:block;font:400 18px 'Do Hyeon'}
.row span{display:block;font-size:13px;color:#6d5539;line-height:1.35}
.row button{flex:none;border:0;border-radius:12px;background:var(--green);color:#fff;font:400 15px 'Do Hyeon';padding:8px 10px;min-width:74px;line-height:1.15;cursor:pointer}
.row button small{display:block;font:400 12px 'Gowun Dodum';opacity:.9}
.row button:disabled{background:#c9b99a;color:#f4ecdc}
.row.lock{opacity:.6}
.note{font-size:13px;color:#7b6247;margin:2px 4px 10px;line-height:1.45}
.chart{display:flex;align-items:flex-end;gap:3px;height:70px;margin:4px 4px 10px;padding:6px;background:#fff;border:1px solid #e3cfa6;border-radius:12px}
.chart i{flex:1;background:#c99a55;border-radius:3px 3px 0 0}
.chart i.now{background:var(--red)}
#set-btn{border:1px solid #c79a5a;background:rgba(40,25,12,.72);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer}
#setwin,#confirm{position:absolute;inset:0;z-index:85;background:rgba(15,9,4,.6);display:none;align-items:center;justify-content:center;padding:20px}
#setwin.on,#confirm.on{display:flex}#confirm{z-index:97}
.sw{background:var(--paper);border-radius:18px;padding:16px;width:100%;max-width:360px;max-height:90%;overflow-y:auto}
.sw h3{margin:0 0 10px;font:400 22px 'Do Hyeon';text-align:center}
.sr{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #e6d3ae;font:400 16px 'Do Hyeon'}
.sr span{flex:1}.sr small{display:block;font:400 12px 'Gowun Dodum';color:#7b6247}
.sr input[type=range]{width:120px;accent-color:var(--green)}.sr input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.sr select{font:400 14px 'Gowun Dodum';padding:4px;border-radius:8px;border:1px solid #c9a978;background:#fff}
.sw button{border:0;border-radius:10px;background:var(--green);color:#fff;font:400 15px 'Do Hyeon';padding:7px 12px;cursor:pointer}
.sw button.danger{background:var(--red)}.sw button.close{display:block;margin:12px auto 0;background:#8a6a45;padding:9px 30px}
#confirm p{font-size:15px;line-height:1.5;text-align:center;margin:0 0 14px}.cfb{display:flex;gap:10px;justify-content:center}#cf-no{background:#b9a888}
#toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(30,20,10,.88);color:#fff6e0;padding:8px 14px;border-radius:14px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1}
#story{position:absolute;inset:0;z-index:80;background:rgba(15,9,4,.82);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#story.on{display:flex}
#cut{width:100%;max-width:400px;background:var(--paper);border-radius:6px;border:3px solid #2b1d11;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;animation:cutin .35s ease-out}
@keyframes cutin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
#cut .pic{width:100%;aspect-ratio:372/400;background:#fff center 8%/cover no-repeat;border-bottom:3px solid #2b1d11}
#cut .nar{padding:34px 22px;font:400 19px 'Gowun Dodum';line-height:1.7;text-align:center;white-space:pre-line}
#cut .say{padding:12px 16px 16px}
#cut .say b{display:inline-block;font:400 18px 'Do Hyeon';background:#3b2a1c;color:#fff1d2;border-radius:10px;padding:2px 10px;margin-bottom:6px}
#cut .say p{margin:0;font-size:17px;line-height:1.6;white-space:pre-line}
#story .hint{color:#e8d6b4;font-size:13px;margin-top:12px;opacity:.8}
#story .skip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;border:1px solid #c9a978;background:transparent;color:#e8d6b4;border-radius:14px;padding:4px 12px;font:400 14px 'Do Hyeon'}
#namebox{position:absolute;inset:0;z-index:90;background:rgba(15,9,4,.85);display:none;align-items:center;justify-content:center;padding:24px}
#namebox.on{display:flex}
#namebox div{background:var(--paper);border-radius:18px;padding:20px;width:100%;max-width:340px;text-align:center}
#namebox h3{margin:0 0 6px;font:400 22px 'Do Hyeon'}
#namebox p{margin:0 0 12px;font-size:14px;color:#6d5539}
#namebox input{width:100%;font:400 20px 'Do Hyeon';text-align:center;padding:10px;border:2px solid #c9a978;border-radius:12px;background:#fff}
#namebox small{display:block;color:var(--red);min-height:18px;margin-top:6px;font-size:13px}
#namebox button{margin-top:8px;border:0;border-radius:12px;background:var(--green);color:#fff;font:400 18px 'Do Hyeon';padding:10px 26px}
#title{position:absolute;inset:0;z-index:95;background:#2a1d13 url(a/bg1.webp) center/cover;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18%}
#title:before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000b)}
#title h1{position:relative;margin:0;font:400 54px 'Do Hyeon';color:#fff1d2;text-shadow:0 3px 0 #6b4426,0 0 18px #000}
#title p{position:relative;margin:6px 0 26px;color:#f2dcb3;font-size:15px}
#title button{position:relative;border:0;border-radius:28px;background:linear-gradient(#f5d27a,#d99a35);box-shadow:0 5px 0 #8a5a1c;font:400 24px 'Do Hyeon';color:#4a2a0c;padding:12px 40px}
</style>
</head>
<body>
<div id="app">
 <div id="scene"><img id="bg" alt=""><img id="heroimg" class="hero" src="a/gayoung.webp" alt=""><img id="sam" class="hero helper" src="a/samwol.webp" alt="" hidden><img id="mae" class="hero helper" src="a/maehwa.webp" alt="" hidden><img id="srv" class="hero helper" src="a/v_server.webp" alt="" hidden></div>
 <div id="top">
  <div class="res"><img src="a/u0.webp" alt="엽전"><span id="r-money">0</span></div>
  <div class="res"><img src="a/u1.webp" alt="커피콩"><span id="r-bean">0</span></div>
  <div class="res"><img src="a/u4.webp" alt="인기"><span id="r-pop">0</span></div>
  <div class="res" id="res-ice" hidden><img src="a/u2.webp" alt="얼음"><span id="r-ice">0</span></div>
  <div class="res" id="res-star" hidden><img src="a/u3.webp" alt="별 조각"><span id="r-star">0</span></div>
  <div id="day"></div><button type="button" id="set-btn" aria-label="설정"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#fff3d6" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
 </div>
 <div id="floors" hidden><button type="button" data-f="0">1층</button><button type="button" data-f="1">2층</button><button type="button" data-f="2">금남당</button><button type="button" data-f="b" class="fb-b">빙고 <img src="a/u2.webp" alt="얼음"><i id="fb-ice">0</i><img src="a/u3.webp" alt="별 조각"><i id="fb-star">0</i></button></div>
 <div id="event" hidden></div>
 <div id="bottom">
  <div id="combo" hidden></div><button id="brew" type="button"><div class="fill"></div><span>가비 내리기</span><small id="brew-sub">손님을 기다리는 중</small></button>
  <div id="tabs">
   <button type="button" data-t="menu"><img src="a/m0.webp" alt=""><i class="dot"></i>메뉴</button>
   <button type="button" data-t="staff"><img src="a/u5.webp" alt=""><i class="dot"></i>일손</button>
   <button type="button" data-t="shop"><img src="a/u6.webp" alt=""><i class="dot"></i>가게</button>
   <button type="button" data-t="market"><img src="a/u1.webp" alt=""><i class="dot"></i>장터</button>
   <button type="button" data-t="story"><img src="a/u7.webp" alt=""><i class="dot"></i>이야기</button>
  </div>
 </div>
 <div id="panel"><header><span id="p-title"></span><small id="p-sub"></small><button type="button" id="p-x" aria-label="닫기">✕</button></header><div id="plist"></div></div>
 <div id="setwin"><div class="sw"><h3>설정</h3>
  <div class="sr"><span>효과음</span><input type="range" id="sv-vol" min="0" max="100" step="5"></div>
  <label class="sr"><span>배경 음악</span><input type="checkbox" id="sv-bgm"></label>
  <div class="sr"><span>음악 크기</span><input type="range" id="sv-mvol" min="0" max="100" step="5"></div>
  <label class="sr"><span>진동<small>폰에서 누를 때 살짝 떨려요</small></span><input type="checkbox" id="sv-vib"></label>
  <label class="sr"><span>숫자 띄우기<small>누를 때 "+1"이 튀어 올라요</small></span><input type="checkbox" id="sv-pop"></label>
  <div class="sr"><span>새 이야기<small>열리면 바로 볼지, 이야기 탭에 쌓아 둘지</small></span><select id="sv-story"><option value="now">바로 보기</option><option value="later">나중에 보기</option></select></div>
  <div class="sr"><span>이름<small id="sv-name"></small></span><button type="button" id="sv-rename">바꾸기</button></div>
  <div class="sr"><span>처음부터 다시<small>모든 진행이 지워져요</small></span><button type="button" id="sv-reset" class="danger">다시 하기</button></div>
  <button type="button" id="sv-x" class="close">닫기</button><p id="sv-ver" style="text-align:center;font-size:12px;color:#9a8466;margin:8px 0 0;user-select:none">판 11.01-무릉도원-5</p>
  <div id="sv-test" hidden><div class="sr"><span>시험용</span></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
    <button type="button" data-t="m1">엽전 +800억</button><button type="button" data-t="m2">엽전 +1조</button>
    <button type="button" data-t="bean">콩 +1000</button><button type="button" data-t="ice">얼음 가득</button>
    <button type="button" data-t="star">별 조각 +10</button><button type="button" data-t="day">하루 넘기기</button>
    <button type="button" data-t="sum">여름으로</button><button type="button" data-t="win">겨울로</button>
   </div></div></div></div>
 <div id="confirm"><div class="sw"><h3 id="cf-t"></h3><p id="cf-m"></p><div class="cfb"><button type="button" id="cf-no">그만두기</button><button type="button" id="cf-ok" class="danger">확인</button></div></div></div>
 <div id="toast"></div>
 <div id="story"><button type="button" class="skip" id="st-skip">건너뛰기</button><div id="cut"></div><div class="hint">화면을 눌러 넘기기</div></div>
 <div id="namebox"><div><h3>당신의 이름은?</h3><p>조선에서 불릴 이름을 지어 주세요.</p><input id="nm" maxlength="8" value="한가영"><small id="nm-err"></small><button type="button" id="nm-ok">정했어요</button></div></div>
 <div id="title"><h1>카페 인 한양</h1><p>조선 한양, 첫 번째 가비집 이야기</p><button type="button" id="t-go">시작하기</button></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
// ---------- 자료 ----------
const STAGES=[
 {n:'만상 창고',bg:'a/bg0.webp',hero:{x:24,b:36},seats:[[58,18],[76,16],[91,19],[42,17],[67,27],[85,28]],base:3},
 {n:'다우가',bg:'a/bg1.webp',hero:{x:50,b:46},seats:[[18,22],[50,17],[84,24],[32,31],[70,31],[13,37],[88,37],[50,34]],base:4},
 {n:'무릉도원'}];
// 무릉도원 층: 1층(누구나) 2층(양반, 값 4배) 금남당(여인, 값 3배)
const FLOORS=[
 {n:'무릉도원 1층',bg:'a/bg2.webp',hero:{x:22,b:38},seats:[[56,26],[80,29],[42,12],[72,10],[90,18],[20,8],[60,3],[34,24]],base:5,cust:[0,1,2,5,4,12],sp:[1,2],mul:1,gap:1},
 {n:'무릉도원 2층',bg:'a/bg3.webp',hero:{x:16,b:32},seats:[[58,26],[82,22],[40,8],[74,5],[24,14]],base:3,cust:[9,10,4,9],sp:[0],mul:4,gap:2.2},
 {n:'금남당',bg:'a/bg4.webp',hero:{x:84,b:26},seats:[[22,30],[48,34],[64,20],[30,8],[56,4]],base:4,cust:[10,11,12,3],sp:[],mul:3,gap:1.6}];

 if(tab==='shop'){$('p-title').textContent='가게';$('p-sub').textContent=cur().n;
  SHOP.forEach(s=>{const lv=L(S.shop,s[0]);if(!shopVis(s)){if(s[6]===S.stage+1&&!(s[7]&&S.stage>=s[6]))h+=`<div class="row lock"><img src="a/${s[2]}.webp" alt=""><div><b>${s[1]}</b><span>${s[6]===1?'다우가를 열면 생겨요':'무릉도원을 열면 생겨요'}</span></div></div>`;return}
   const max=s[4](S.stage),cost=s[5](lv),why=shopWhy(s);let btn;if(lv>=max)btn='<button disabled>다 했어요</button>';else if(why)btn=`<button disabled>${why}</button>`;else btn=`<button type="button" data-a="shop" data-k="${s[0]}" data-c="${cost}" ${S.money<cost?'disabled':''}>${max>1?'올리기':'하기'}<small>${won(cost)}</small></button>`;
   h+=`<div class="row"><img src="a/${s[2]}.webp" alt=""><div><b>${s[1]}${max>1?` <small>${lv} / ${max}</small>`:''}</b><span>${s[3]}</span></div>${btn}</div>`})}
 if(tab==='binggo'){$('p-title').textContent='지하 빙고';$('p-sub').textContent=`얼음 ${S.ice||0}/${iceCap()} · 별 조각 ${ready()}/${S.star||0}`;const ip=icePrice();
  h+=`<img class="bghead" src="a/bg5.webp" alt=""><p class="note">아이스 메뉴 한 잔에 차가운 별 조각 하나를 써요. 쓴 별 조각은 얼음 한 덩이로 열 개씩 다시 식혀요. 겨울엔 날마다 채빙해서 얼음이 들어와요.${season()===1?' 여름이라 얼음이 비싸고 아이스 메뉴가 잘 팔려요.':''}</p>`;
  h+=`<div class="row"><img src="a/u3.webp" alt=""><div><b>별 조각 식히기</b><span>데워진 별 조각 ${S.warm||0}개 · 얼음 1덩이로 10개</span></div><button type="button" data-a="cool" ${(S.ice>0&&S.warm>0)?'':'disabled'}>식히기</button></div>`;
  [10,50].forEach(n=>{h+=`<div class="row"><img src="a/u2.webp" alt=""><div><b>얼음 ${n}덩이 사기</b><span>${won(ip*n)}</span></div><button type="button" data-a="ice" data-n="${n}" data-c="${ip*n}" ${S.money<ip*n?'disabled':''}>사기</button></div>`})}
 if(tab==='market'){$('p-title').textContent='장터';$('p-sub').textContent='커피콩 값은 날마다 바뀌어요';const p=beanPrice(),mx=Math.max(...S.beanP,p);
  h+=`<div class="chart">${S.beanP.map((v,i)=>`<i class="${i===S.beanP.length-1?'now':''}" style="height:${Math.max(6,v/mx*100)}%"></i>`).join('')}</div><p class="note">오늘 값 커피콩 1개 ${won(p)}. 막대가 낮은 날 사 두면 이득이에요. 흑가비와 꿀가비는 한 잔에 콩 1개를 써요.</p>`;
  [10,50,200].forEach(n=>{h+=`<div class="row"><img src="a/u1.webp" alt=""><div><b>커피콩 ${n}개</b><span>${won(p*n)}</span></div><button type="button" data-a="bean" data-n="${n}" data-c="${p*n}" ${S.money<p*n?'disabled':''}>사기</button></div>`})}
 if(tab==='story'){$('p-title').textContent='이야기';$('p-sub').textContent='지금까지 열린 장면';
  STORDER.forEach(k=>{const o=S.seen[k];h+=o?`<div class="row"><img src="a/u7.webp" alt=""><div><b>${ST[k].t}${o==='new'?' <small style="color:var(--red)">새 이야기</small>':''}</b></div><button type="button" data-a="replay" data-k="${k}">보기</button></div>`:`<div class="row lock"><img src="a/u7.webp" alt=""><div><b>???</b><span>아직 열리지 않았어요</span></div></div>`})}
 P.innerHTML=h}
$('plist').addEventListener('pointerdown',()=>{lastPanelDown=performance.now()});
$('plist').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,k=b.dataset.k;
 if(a==='mopen'){const m=MENU[MI[k]],q=menuReq(k);if(S.money<m[4]||(q&&q.have<q.need))return;S.money-=m[4];S.menu[k]=1;sfx('trade');toast(`${m[1]}${josa(m[1])} 메뉴에 올렸어요`)}
 if(a==='mup'){const lv=L(S.menu,k),cost=mupCost(k);if(lv>=MMAX)return;if(S.money<cost)return;S.money-=cost;S.menu[k]=lv+1;sfx('trade')}
 if(a==='staff'){const s=STAFF.find(x=>x[0]===k),lv=L(S.staff,k),cost=s[5](lv);if(S.money<cost||lv>=(s[7]||10))return;S.money-=cost;S.staff[k]=lv+1;sfx('trade');helpers();if(!lv)toast(`${s[1]}${josa2(s[1])} 일손이 됐어요`)}
 if(a==='shop'){const s=SHOP.find(x=>x[0]===k),lv=L(S.shop,k),cost=s[5](lv);if(S.money<cost)return;S.money-=cost;S.shop[k]=lv+1;sfx('trade');
  if(k==='pot')playStory('pot');if(k==='dawooga'){S.stage=1;S.shop.seat=0;setStage();closePanel();playStory('dawooga')}
  if(k==='murung'){S.stage=2;S.floor=0;S.shop.seat=0;S.ice=10;S.star=10;S.warm=0;setStage();closePanel();playStory('murungopen')}
  if(k==='stars'){S.star=(S.star||0)+10;toast('유기 별 조각 10개가 들어왔어요')}
  if(k==='floor2'){toast('위쪽 "2층"을 눌러 올라가 보세요')}
  if(k==='geum'){playStory('geumnam')}floorsDraw()}
 if(a==='cool'){if(coolStars()){sfx('water');toast('별 조각을 차갑게 식혔어요')}}
 if(a==='ice'){const n=+b.dataset.n,c=icePrice()*n;if(S.money<c)return;if((S.ice||0)+n>iceCap()){toast('빙고에 자리가 없어요. 빙고를 늘려 주세요');return}S.money-=c;S.ice=(S.ice||0)+n;sfx('trade')}
 if(a==='bean'){const n=+b.dataset.n,p=beanPrice();if(S.money<p*n)return;S.money-=p*n;S.bean+=n;sfx('trade');toast(`커피콩 ${n}개를 샀어요`)}
 if(a==='replay'){playStory(k,true);return}
 hud();drawPanel();save()};
const josa=w=>{const c=w.charCodeAt(w.length-1)-0xac00;return c>=0&&c%28?'을':'를'};
const josa2=w=>{const c=w.charCodeAt(w.length-1)-0xac00;return c>=0&&c%28?'이':'가'};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab===b.dataset.t?closePanel():openPanel(b.dataset.t)});
$('p-x').onclick=closePanel;
// ---------- 이야기 재생 ----------
let SQ=null;
function storyFx(k){if(k==='cheap'&&!S.gotCheap){S.gotCheap=1;S.bean+=200;toast('커피콩 200개를 얻었어요')}if(k==='hajun'&&!S.gotHajun){S.gotHajun=1;S.pop+=50}if(k==='seonwoo'&&!S.evDone){S.ev='seonwoo';S.evUntil=Date.now()+DAYSEC*1000*4;S.evDone=1}if(k==='prison'&&!S.prDone){S.ev='prison';S.evUntil=Date.now()+DAYSEC*1000*3;S.prDone=1;CU.splice(0).forEach(c=>c.el.remove());helpers()}if(k==='release'&&!S.relDone){S.relDone=1;S.ev=null;S.pop+=500;helpers()}}
function playStory(k,replay){const s=ST[k];if(!s)return;setTimeout(bgmSync,0);if(!replay&&SET.story==='later'&&k!=='start'){S.seen[k]='new';storyFx(k);toast(`새 이야기 「${s.t}」 열렸어요`);hud();save();return}if(!replay){S.seen[k]='new'}SQ={k,i:0,replay};$('story').classList.add('on');showCut();sfx('open')}
function nm(t){return t.replace(/\{name\}/g,S.name)}
function showCut(){const c=ST[SQ.k].c[SQ.i];const cut=$('cut');if(!c){endStory();return}
 if(c.ask==='name'){if(SQ.replay){SQ.i++;showCut();return}$('namebox').classList.add('on');$('nm').value=S.name;return}
 cut.style.animation='none';void cut.offsetWidth;cut.style.animation='';
 if(c.n){cut.innerHTML=`<div class="nar">${esc(nm(c.n))}</div>`}
 else cut.innerHTML=(c.p?`<div class="pic" style="background-image:url(a/p_${c.p}.webp)"></div>`:'')+`<div class="say"><b>${esc(nm(c.w))}</b><p>${esc(nm(c.s))}</p></div>`}
function esc(t){return t.replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}
function endStory(){setTimeout(bgmSync,0);const k=SQ.k;$('story').classList.remove('on');if(S.seen[k]==='new')S.seen[k]=1;
 if(!SQ.replay)storyFx(k);
 SQ=null;hud();drawPanel();save();checkStory()}
$('story').onclick=e=>{if(e.target.id==='st-skip')return;if(!SQ)return;SQ.i++;sfx('menu');showCut()};
$('st-skip').onclick=e=>{e.stopPropagation();if(!SQ)return;if(!SQ.replay&&ST[SQ.k].c.some((c,i)=>c.ask&&i>=SQ.i)){SQ.i=ST[SQ.k].c.findIndex(c=>c.ask);showCut();return}endStory()};
$('nm-ok').onclick=()=>{const v=$('nm').value.replace(/[<>&]/g,'').trim();if(v.length<2){$('nm-err').textContent='두 글자 이상으로 지어 주세요';return}if(/[ㄱ-ㅎㅏ-ㅣ]/.test(v)){$('nm-err').textContent='자음이나 모음만 쓴 글자는 쓸 수 없어요';return}S.name=v;$('namebox').classList.remove('on');$('nm-err').textContent='';if(SQ){SQ.i++;showCut()}else{toast(`이름을 ${v}(으)로 바꿨어요`);setDraw()}save()};
function checkStory(){if(SQ)return;const T=[
 ['first',()=>S.served>=1],['samwol',()=>S.served>=12],['seyun',()=>S.stage>=1&&S.served>=90],['gwageo',()=>gwageo()&&S.served>=20],['tired',()=>S.stage>=1&&S.served>=160],
 ['seonwoo',()=>S.stage>=1&&S.earned>=5e6],['cheap',()=>S.evDone&&Date.now()>S.evUntil],['hajun',()=>S.stage>=1&&S.served>=260],['murung',()=>S.stage>=1&&S.earned>=3e9],['prison',()=>S.stage===2&&L(S.menu,'icesujeong')>0],['release',()=>S.prDone&&Date.now()>S.evUntil]];
 for(const [k,f] of T)if(!S.seen[k]&&f()){setTimeout(()=>{if(!SQ&&!S.seen[k])playStory(k)},500);return}}
// ---------- 무릉도원 층 ----------
function floorsDraw(){const fb=$('floors');fb.hidden=S.stage!==2;if(fb.hidden)return;fb.querySelectorAll('button').forEach(b=>{const f=b.dataset.f;b.classList.toggle('on',f===String(S.floor||0)&&tab!=='binggo'||f==='b'&&tab==='binggo');if(f==='1')b.disabled=!L(S.shop,'floor2');if(f==='2')b.disabled=!L(S.shop,'geum')})}
$('floors').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const f=b.dataset.f;sfx('menu');if(f==='b'){tab==='binggo'?closePanel():openPanel('binggo');floorsDraw();return}if(+f===(S.floor||0)){floorsDraw();return}S.floor=+f;setStage();hud();save()};
// ---------- 설정 ----------
function setDraw(){$('sv-vol').value=SET.vol;$('sv-mvol').value=SET.mvol;$('sv-bgm').checked=!!SET.bgm;$('sv-vib').checked=!!SET.vib;$('sv-pop').checked=!!SET.pop;$('sv-story').value=SET.story;$('sv-name').textContent=S.name}
$('set-btn').onclick=()=>{setDraw();$('setwin').classList.add('on');sfx('open')};
$('sv-x').onclick=()=>$('setwin').classList.remove('on');
$('setwin').onclick=e=>{if(e.target.id==='setwin')$('setwin').classList.remove('on')};
$('sv-vol').oninput=e=>{SET.vol=+e.target.value;saveSet()};$('sv-vol').onchange=()=>sfx('act');
$('sv-bgm').onchange=e=>{SET.bgm=e.target.checked?1:0;saveSet();bgmSync()};
$('sv-mvol').oninput=e=>{SET.mvol=+e.target.value;saveSet();bgmSync()};
$('sv-vib').onchange=e=>{SET.vib=e.target.checked?1:0;saveSet();if(SET.vib&&navigator.vibrate)try{navigator.vibrate(20)}catch(_){}};
$('sv-pop').onchange=e=>{SET.pop=e.target.checked?1:0;saveSet()};
$('sv-story').onchange=e=>{SET.story=e.target.value;saveSet()};
$('sv-rename').onclick=()=>{$('nm').value=S.name;$('nm-err').textContent='';$('namebox').classList.add('on')};
let cfOk=null;function confirmBox(t,m,f,ok){$('cf-t').textContent=t;$('cf-m').textContent=m;$('cf-ok').textContent=ok||'확인';cfOk=f;$('confirm').classList.add('on')}
$('cf-no').onclick=()=>{$('confirm').classList.remove('on');cfOk=null};$('cf-ok').onclick=()=>{$('confirm').classList.remove('on');const f=cfOk;cfOk=null;if(f)f()};
// 비밀 버튼: 판 표시를 빠르게 일곱 번 누르면 시험용 단추가 열려요
{let n=0,t=0;$('sv-ver').onclick=()=>{const now=Date.now();n=now-t<600?n+1:1;t=now;if(n>=7){n=0;$('sv-test').hidden=!$('sv-test').hidden;toast($('sv-test').hidden?'시험용 단추를 닫았어요':'시험용 단추가 열렸어요')}}}
$('sv-test').onclick=e=>{const b=e.target.closest('button[data-t]');if(!b)return;const t=b.dataset.t;
 if(t==='m1')S.money+=8e10;if(t==='m2')S.money+=1e12;if(t==='bean')S.bean+=1000;if(t==='ice')S.ice=iceCap();if(t==='star')S.star=(S.star||0)+10;
 if(t==='day'){S.day++;rollBean();dailyIce()}if(t==='sum')S.day=SEASONDAY+1;if(t==='win')S.day=SEASONDAY*3+1;
 sfx('trade');toast(b.textContent+' 했어요');hud();save();checkStory()};
$('sv-reset').onclick=()=>confirmBox('처음부터 할까요?','엽전, 메뉴, 일손, 가게, 이야기까지 모든 진행이 지워져요. 되돌릴 수 없어요.',()=>{RESET=true;try{localStorage.removeItem(SAVE)}catch(_){}location.reload()},'처음부터');
// ---------- 시간 ----------
let coolT=0,last=performance.now(),autoAcc=0,saveT=0;
function tick(now){const dt=Math.min(.2,(now-last)/1000);last=now;
 const paused=!!SQ||$('title').style.display!=='none';
 if(!paused){S.dayT+=dt;if(S.dayT>=DAYSEC){S.dayT-=DAYSEC;S.day++;rollBean();dailyIce();hud();if(tab==='market'&&performance.now()-lastPanelDown>1500)drawPanel();checkStory()}
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=spawnGap()*(.7+Math.random()*.6)}
  CU.forEach(c=>{if(!c.arr||c.done)return;c.pat-=dt;const b=c.el.querySelector('.bub i b');if(b){b.style.width=Math.max(0,c.pat/c.max*100)+'%';b.style.background=c.pat/c.max<.3?'#c0452f':''}
   if(c.pat<=0){S.pop=Math.max(0,S.pop-1);const r=c.el.getBoundingClientRect(),ar=$('app').getBoundingClientRect();pop('기다리다 갔어요',r.left-ar.left+r.width/2,r.top-ar.top,true);leave(c,false);hud()}});
  const ar=autoRate();if(ar){autoAcc+=ar*dt;while(autoAcc>=1){autoAcc-=1;brewTap(0,true);const sm=$('sam');sm.classList.add('work');setTimeout(()=>sm.classList.remove('work'),120)}}
  {const bl=L(S.staff,'binggo');if(bl&&S.stage===2){coolT=(coolT||0)+dt;if(coolT>=6/bl){coolT=0;if((S.warm||0)>=5||(!ready()&&S.warm>0))coolStars()}}}
  saveT+=dt;if(saveT>5){saveT=0;save()}drawBrew()}
 requestAnimationFrame(tick)}
// 화면 어디를 눌러도 가비 내리기 (창·메뉴·위 표시줄은 빼고). 손가락이 닿는 순간 셈
const NOTAP='#floors,#top,#tabs,#panel,#story,#namebox,#setwin,#confirm,#title';
$('app').addEventListener('pointerdown',e=>{if(e.button>0)return;if(e.target.closest(NOTAP))return;if(SQ)return;e.preventDefault();brewTap();if(e.target.closest('#brew')){const b=$('brew');b.classList.add('down');setTimeout(()=>b.classList.remove('down'),90)}},{passive:false});
// ---------- 자리 비운 동안 ----------
function offline(){const sec=Math.min(7200,(Date.now()-(S.lastTs||Date.now()))/1000);if(sec<30)return;const days=Math.floor(sec/DAYSEC);for(let i=0;i<Math.min(days,20);i++){rollBean();S.day++;dailyIce()}S.day+=Math.max(0,days-20);
 const ar=autoRate();if(!ar)return;const g=Math.round(sec*ar*tapVal()*.5);if(g>0){S.money+=g;S.earned+=g;setTimeout(()=>toast(`자리를 비운 동안 삼월이가 ${won(g)}을 벌었어요`),800)}}
// ---------- 시작 ----------
load();if(!S.beanP.length)for(let i=0;i<10;i++)rollBean();
setStage();hud();drawBrew();
$('t-go').onclick=()=>{$('title').style.display='none';bgmSync();sfx('open');offline();hud();if(!S.seen.start)playStory('start');else checkStory()};
requestAnimationFrame(tick);
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();bgmSync()});
